geomagic_omni_state_adapter:
  ros__parameters:
    omni_state_topic: /phantom/state
    output_pose_topic: /geomagic_touch/pose
    output_buttons_topic: /geomagic_touch/buttons
    frame_id: geomagic_touch_base
    pose_position_scale: 0.001
    deadman_from_locked: true
    deadman_source: locked
    gripper_from_close_gripper: true
    stamp_with_now: true

geomagic_gripper_toggle:
  ros__parameters:
    input_buttons_topic: /geomagic_touch/buttons
    status_topic: /arm_teleop/gripper_status
    gripper_action_name: /gripper_controller/gripper_cmd
    toggle_button_index: 1
    open_position: 0.0
    closed_position: -0.69
    max_effort: 0.0
    start_closed: false
    debounce_s: 0.35
    wait_for_server_s: 0.0
    allow_interrupt: true

geomagic_cartesian_teleop:
  ros__parameters:
    input_pose_topic: /geomagic_touch/pose
    input_buttons_topic: /geomagic_touch/buttons
    output_twist_topic: /arm_teleop/raw_twist_cmd
    status_topic: /arm_teleop/teleop_status
    command_frame: uav_mount
    ee_frame_name: tool0
    angular_command_frame: tool0
    publish_rate_hz: 200.0
    input_timeout_s: 0.25
    deadman_button_index: 0
    translation_gain: 3.0
    translation_deadband_m: 0.005
    rotation_gain: 2.5
    orientation_deadband_rad: 1.5
    max_linear_speed_m_s: 0.12
    max_angular_speed_rad_s: 0.35
    low_pass_alpha: 0.3
    orientation_enabled: true
    robot_axes_from_device: ["-y", "x", "z"]
    robot_angular_axes_from_device: ["-y", "x", "z"]
    zero_on_release: true

teleop_safety_filter:
  ros__parameters:
    input_twist_topic: /arm_teleop/raw_twist_cmd
    output_twist_topic: /arm_teleop/twist_cmd
    input_buttons_topic: /geomagic_touch/buttons
    homing_state_topic: /arm_homing/state
    status_topic: /arm_teleop/safety_status
    command_frame: uav_mount
    ee_frame_name: tool0
    publish_rate_hz: 100.0
    input_timeout_s: 0.25
    button_timeout_s: 0.25
    homing_timeout_s: 2.0
    deadman_button_index: 0
    require_deadman: true
    require_homing: false
    require_tool_tf: true
    low_pass_alpha: 0.2
    max_linear_accel_m_s2: 0.3
    max_angular_accel_rad_s2: 0.35
    workspace_min: [-10.0, -10.0, -10.0]
    workspace_max: [10.0, 10.0, 10.0]
    max_linear_m_s: 0.12
    max_angular_rad_s: 0.35

trajectory_deadman_gate:
  ros__parameters:
    input_trajectory_topic: /arm_teleop/servo_raw_joint_trajectory
    output_trajectory_topic: /arm_teleop/dry_run_joint_trajectory
    input_twist_topic: /arm_teleop/twist_cmd
    input_buttons_topic: /geomagic_touch/buttons
    joint_state_topic: /joint_states
    homing_state_topic: /arm_homing/state
    status_topic: /arm_teleop/trajectory_gate_status
    deadman_button_index: 0
    arm_joints: ["joint_1", "joint_2", "joint_3", "joint_4", "joint_5", "joint_6"]
    require_deadman: true
    require_homing: true
    require_nonzero_twist: true
    button_timeout_s: 0.25
    twist_timeout_s: 0.25
    homing_timeout_s: 2.0
    min_linear_speed_m_s: 0.003
    min_angular_speed_rad_s: 0.01
    armed_on_start: true
    publish_hold_on_block: true
    hold_duration_s: 0.20
    integrate_servo_deltas: true
    integrated_command_scale: 1.0
    max_integrated_step_rad: 0.002
    integrated_command_duration_s: 0.1
    integrated_publish_rate_hz: 100.0

trajectory_command_monitor:
  ros__parameters:
    trajectory_topic: /arm_controller/joint_trajectory
    joint_names: ["joint_1", "joint_2", "joint_3", "joint_4", "joint_5", "joint_6"]
    plot: true
    plot_history_sec: 15.0
    plot_rate_hz: 10.0
    position_abs_rad: 3.2
    step_abs_rad: 0.006
    velocity_abs_rad_s: 0.5
    csv_enabled: false
    csv_file: /tmp/teleop_final_command.csv
    csv_append: false
